        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orders/{id}/simulate:
    post:
      tags: [Checkout]
      summary: Simulasi hasil pembayaran (development, PAYMENT_PROVIDER=fake)
      description: >-
        Hanya aktif dengan gateway palsu; selain itu 404. Gateway palsu membuat notifikasi
        bertanda tangan seperti simulator sandbox Midtrans, lalu notifikasi diproses lewat jalur
        webhook yang sama (dicatat, signature diperiksa, status dikonfirmasi ke gateway).
      operationId: simulatePayment
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [paid, failed, expired] }
      responses:
        "200":
          description: Order setelah notifikasi diproses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /webhooks/midtrans:
    post:
      tags: [Webhook]
      summary: HTTP notification Midtrans
      description: >-
        Tanpa auth. signature_key = SHA512(order_id + status_code + gross_amount + server key).
        Setiap notifikasi dicatat di payment_notifications; yang signature-nya tidak valid tidak
        diproses. Status dikonfirmasi ke API gateway sebelum order diubah, dan notifikasi ganda
        aman. Lunas: enrollment menjadi not_started dengan batas mulai 30 hari.
      operationId: midtransNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: string }
                transaction_id: { type: string }
                transaction_status: { type: string }
                fraud_status: { type: string }
                status_code: { type: string }
                gross_amount: { type: string }
                payment_type: { type: string }
                signature_key: { type: string }
      responses:
        "200":
          description: Notifikasi tercatat
        "400":
          description: Body bukan notifikasi yang valid

