openapi: 3.0.3
info:
  title: Simula API
  version: 0.1.0
  description: |
    Kontrak REST API Simula. Bentuk data mengikuti tipe di `client/src/types/`.

    - Semua respons sukses dibungkus `Envelope` ({ success, message, data }).
    - Semua respons error memakai `ErrorEnvelope`; `errors` berisi error validasi per field.
    - JSON camelCase, enum string lowercase, field kosong bernilai `null`, waktu ISO 8601 UTC.
    - Sesi memakai cookie httpOnly `access_token` dan `refresh_token`.
servers:
  - url: http://localhost:8080/api
    description: Lokal

tags:
  - name: System
    description: Health check
  - name: Auth
    description: Daftar, masuk, sesi, login Google, onboarding
  - name: Learning
    description: Katalog, dashboard, Case Saya, Sertifikat Saya
  - name: Workspace
    description: Pengerjaan, draft, submit, unggah berkas, halaman status
  - name: Result
    description: Halaman hasil dan coba lagi
  - name: Certificate
    description: Verifikasi sertifikat publik
  - name: Checkout
    description: Order B2B dan pembayaran
  - name: Webhook
    description: Notifikasi layanan eksternal
  - name: Reviewer
    description: Portal reviewer mitra (kandidat anonim)
  - name: Admin
    description: Panel admin (Reviewer & Mitra, Penilaian)

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness, proses berjalan
      operationId: getHealth
      responses:
        "200":
          description: Proses berjalan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Liveness"

  /health/ready:
    get:
      tags: [System]
      summary: Readiness, database dan Redis bisa dijangkau
      operationId: getHealthReady
      responses:
        "200":
          description: Semua dependency siap
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Readiness"
        "503":
          description: Ada dependency yang tidak bisa dijangkau (success = false)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Readiness"

  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun mahasiswa, langsung masuk
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Akun dibuat; cookie sesi dipasang
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "409":
          description: Email sudah terdaftar (errors berisi field email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Auth]
      summary: Masuk dengan email dan password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil; cookie sesi dipasang
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          description: Email atau kata sandi salah (pesan sama untuk email yang tidak terdaftar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Akun dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token dan terbitkan access token baru
      description: Dipanggil client otomatis saat request lain mendapat 401. Tanpa body; membaca cookie refresh_token.
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Sesi diperbarui; cookie baru dipasang
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          description: Refresh token tidak ada, kedaluwarsa, atau dicabut; cookie dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Keluar dari perangkat ini
      description: Publik agar cookie tetap terhapus walau sesi sudah kedaluwarsa. Tanpa body.
      operationId: logout
      responses:
        "200":
          description: Sesi dicabut dan cookie dihapus (data null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/me:
    get:
      tags: [Auth]
      summary: User yang sedang masuk
      operationId: getMe
      security:
        - accessCookie: []
      responses:
        "200":
          description: Data user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/google:
    get:
      tags: [Auth]
      summary: Mulai login Google (navigasi browser, bukan XHR)
      operationId: startGoogleLogin
      parameters:
        - name: next
          in: query
          required: false
          description: Path internal tujuan setelah login, mis. /cases/flash-sale. Path tidak aman diabaikan.
          schema:
            type: string
      responses:
        "302":
          description: Redirect ke Google, atau ke /login?error=google bila login Google nonaktif

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback dari Google
      operationId: googleCallback
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: |
            Berhasil → cookie sesi dipasang lalu redirect ke front-end (onboarding untuk akun
            baru, `next`, atau beranda peran). Gagal → /login?error=google atau
            /login?error=account_disabled.

  /users/me/onboarding:
    patch:
      tags: [Auth]
      summary: Lengkapi onboarding mahasiswa
      operationId: completeOnboarding
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Profil tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Bukan mahasiswa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/me/profile:
    get:
      tags: [Auth]
      summary: Profil mahasiswa beserta permintaan berbagi data B2B
      operationId: getMyProfile
      security:
        - accessCookie: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [Auth]
      summary: Perbarui data diri dan bidang pilihan mahasiswa
      operationId: updateMyProfileDetails
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileDetailsRequest"
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/me/data-sharing:
    put:
      tags: [Auth]
      summary: Perbarui sikap bawaan berbagi profil mahasiswa
      operationId: updateMyDataSharing
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shareDefault]
              properties:
                shareDefault:
                  type: string
                  enum: [ask, always, never]
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cases:
    get:
      tags: [Learning]
      summary: Katalog case terbit (bisa tanpa login)
      description: |
        Bila login, urutan `relevance` mendahulukan bidang pilihan user, dan `excludeEnrolled=true`
        menyembunyikan case yang sudah diambil.
      operationId: listCases
      parameters:
        - { name: tier, in: query, schema: { type: string, enum: [ai, b2b] } }
        - { name: field, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, popular, rating, price_low], default: relevance } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: excludeEnrolled, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: Satu halaman katalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/CaseSummary"
                          metadata:
                            $ref: "#/components/schemas/PaginationMeta"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cases/{slug}:
    get:
      tags: [Learning]
      summary: Info umum case sebelum mulai atau membayar (tanpa brief lengkap)
      operationId: getCase
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Detail case; `myEnrollment` terisi bila user login dan sudah mengambil case
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/dashboard:
    get:
      tags: [Learning]
      summary: Dashboard mahasiswa
      operationId: getDashboard
      security:
        - accessCookie: []
      responses:
        "200":
          description: Statistik, case yang perlu tindakan, dan rekomendasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me/enrollments:
    get:
      tags: [Learning]
      summary: Case Saya
      operationId: listEnrollments
      security:
        - accessCookie: []
      parameters:
        - { name: tier, in: query, schema: { type: string, enum: [ai, b2b] } }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, not_started, in_progress, ai_grading, in_review, revision_requested, passed, failed]
        - { name: field, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, deadline, title], default: recent } }
      responses:
        "200":
          description: Enrollment milik user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Enrollment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Learning]
      summary: Mulai AI case gratis (idempoten)
      description: B2B case ditolak 409 karena harus lewat checkout.
      operationId: startCase
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId]
              properties:
                caseId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Enrollment baru atau yang sudah ada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Enrollment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Case B2B harus dibayar lewat checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /me/certificates:
    get:
      tags: [Learning]
      summary: Sertifikat Saya
      operationId: listCertificates
      security:
        - accessCookie: []
      parameters:
        - { name: tier, in: query, schema: { type: string, enum: [ai, b2b] } }
      responses:
        "200":
          description: Sertifikat milik user, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /cases/{slug}/workspace:
    get:
      tags: [Workspace]
      summary: Halaman pengerjaan
      description: >-
        Info case, brief lengkap, enrollment, draft, submission terakhir, dan catatan revisi. Brief
        bernilai null bila user belum mengambil case atau B2B belum dibayar.
      operationId: getWorkspace
      security:
        - accessCookie: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Isi halaman pengerjaan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases/{slug}/status:
    get:
      tags: [Workspace]
      summary: Halaman status (menunggu review, perlu revisi, sedang dinilai AI)
      operationId: getCaseStatus
      security:
        - accessCookie: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status enrollment beserta timeline
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/enrollments/{id}/start:
    post:
      tags: [Workspace]
      summary: Mulai mengerjakan case B2B yang sudah dibayar
      description: Tanpa body. Tenggat = waktu mulai + deadlineDays hari kalender.
      operationId: startWork
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Enrollment berstatus in_progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Enrollment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /me/enrollments/{id}/draft:
    put:
      tags: [Workspace]
      summary: Simpan draft (dipanggil otomatis berkala)
      description: >-
        Hanya saat status in_progress atau revision_requested dan tenggat belum lewat. Slot wajib
        belum diperiksa; bentuk isian, batas panjang, dan kepemilikan berkas tetap diperiksa.
      operationId: saveDraft
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionContent"
      responses:
        "200":
          description: Draft tersimpan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SubmissionDraft"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /me/enrollments/{id}/submit:
    post:
      tags: [Workspace]
      summary: Kirim submission
      description: >-
        AI menjadi ai_grading; B2B menjadi in_review dengan SLA review 5 hari kerja. Setiap berkas
        diperiksa di R2 (harus sudah terunggah dengan ukuran yang sama). Field error memakai nama
        values.<slotId>, isOwnWork, dan isLinkPublic.
      operationId: submitWork
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionContent"
      responses:
        "200":
          description: Enrollment setelah submit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Enrollment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /uploads:
    post:
      tags: [Workspace]
      summary: Buat URL unggah berkas submission ke R2
      description: >-
        Server memvalidasi slot, format, dan ukuran, lalu mencatat berkas sebagai pending. Browser
        mengirim PUT ke uploadUrl dengan header yang diberikan. Berkas yang tidak dipakai di draft
        atau submission dalam 24 jam dihapus.
      operationId: createUpload
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentId, slotId, fileName, sizeBytes]
              properties:
                enrollmentId: { type: string, format: uuid }
                slotId: { type: string }
                fileName: { type: string, maxLength: 200 }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "201":
          description: URL unggah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UploadTicket"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cases/{slug}/result:
    get:
      tags: [Result]
      summary: Halaman hasil (skor per kriteria, feedback, sertifikat)
      description: >-
        review berisi percobaan terakhir yang sudah dinilai; null selama masih dinilai. canRetry
        true bila gagal dan masih boleh mencoba lagi (AI tanpa batas, B2B satu kali).
      operationId: getCaseResult
      security:
        - accessCookie: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Hasil case
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/enrollments/{id}/retry:
    post:
      tags: [Result]
      summary: Coba lagi setelah tidak lulus
      description: >-
        Tanpa body. failed menjadi in_progress untuk percobaan baru. AI tanpa tenggat; B2B
        mendapat tenggat baru 3 hari kalender dan hanya bisa sekali.
      operationId: retryEnrollment
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Enrollment berstatus in_progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Enrollment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /certificates/{id}:
    get:
      tags: [Certificate]
      summary: Verifikasi sertifikat untuk recruiter (tanpa login)
      description: id adalah public_id, misalnya SIM-7K2Q9X4M (tidak peka huruf besar/kecil). Bila login, isOwner menandai pemilik.
      operationId: verifyCertificate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sertifikat terverifikasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CertificateVerification"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases/{slug}/checkout:
    get:
      tags: [Checkout]
      summary: Halaman checkout B2B
      description: >-
        order berisi order terakhir yang belum lunas (menunggu, gagal, atau kedaluwarsa); order
        yang lewat batas bayar sudah kedaluwarsa saat dibaca. Order lunas dan yang dibatalkan
        tidak ditampilkan.
      operationId: getCheckout
      security:
        - accessCookie: []
      parameters:
