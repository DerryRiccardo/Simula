      type: object
      description: IAdminMemberDetail di client
      properties:
        member:
          allOf:
            - $ref: "#/components/schemas/AdminMemberSummary"
            - type: object
              properties:
                institution: { type: string, nullable: true }
                linkedinUrl: { type: string, nullable: true }
                shareDefault: { type: string, enum: [ask, always] }
        enrollments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              caseId: { type: string, format: uuid }
              caseTitle: { type: string }
              tier: { type: string, enum: [ai, b2b] }
              partnerName: { type: string, nullable: true }
              status:
                type: string
                enum: [pending_payment, not_started, in_progress, ai_grading, in_review, revision_requested, passed, failed]
              score: { type: integer, nullable: true }
              updatedAt: { type: string, format: date-time }
              hasReview: { type: boolean }
        orders:
          type: array
          items: { $ref: "#/components/schemas/AdminOrder" }
        certificates:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: public_id sertifikat }
              enrollmentId: { type: string, format: uuid }
              caseTitle: { type: string }
              tier: { type: string, enum: [ai, b2b] }
              score: { type: integer }
              issuedAt: { type: string, format: date-time }
    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          description: IAdminOrder di client
          properties:
            memberId: { type: string, format: uuid }
            memberName: { type: string }
            memberEmail: { type: string, format: email }
            caseTitle: { type: string }
            partnerName: { type: string, nullable: true }
    TalentCandidate:
      type: object
      description: ITalentCandidate di client
      properties:
        id: { type: string, format: uuid, description: ID enrollment }
        memberId: { type: string, format: uuid }
        memberName: { type: string }
        memberEmail: { type: string, format: email }
        fieldKeys: { type: array, items: { type: string } }
        caseId: { type: string, format: uuid }
        caseTitle: { type: string }
        partnerId: { type: string, format: uuid, nullable: true }
        partnerName: { type: string, nullable: true }
        reviewerName: { type: string, nullable: true }
        reviewerRole: { type: string }
        score: { type: integer }
        recommendedAt: { type: string, format: date-time }
        consent: { type: string, enum: [pending, granted, declined] }
        sharedAt: { type: string, format: date-time, nullable: true }
    ProfileDetailsRequest:
      type: object
      required: [name, studentStatus, fieldKeys]
      properties:
        name: { type: string }
        institution: { type: string, nullable: true }
        major: { type: string, nullable: true }
        studentStatus: { type: string, enum: [final_year, fresh_graduate] }
        linkedinUrl: { type: string, nullable: true }
        fieldKeys: { type: array, items: { type: string } }
    StudentProfile:
      type: object
      description: IProfile di client
      properties:
        user: { $ref: "#/components/schemas/User" }
        institution: { type: string, nullable: true }
        linkedinUrl: { type: string, nullable: true }
        shareDefault: { type: string, enum: [ask, always, never] }
        sharedProfiles:
          type: array
          items:
            type: object
            properties:
              enrollmentId: { type: string, format: uuid }
              caseTitle: { type: string }
              partnerName: { type: string }
              consent: { type: string, enum: [pending, granted, declined] }
