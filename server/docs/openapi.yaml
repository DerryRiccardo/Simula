openapi: 3.0.3
info:
  title: Simula API
  version: 0.1.0
  description: |
    Kontrak REST API Simula. Bentuk data mengikuti tipe di `client/src/types/`.

    - Semua respons sukses dibungkus `Envelope` ({ success, message, data }).
    - Semua respons error memakai `ErrorEnvelope`; `errors` berisi error validasi per field.
    - JSON camelCase, enum string lowercase, field kosong bernilai `null`, waktu ISO 8601 UTC.
    - Sesi memakai cookie httpOnly `access_token` dan `refresh_token`.
servers:
  - url: http://localhost:8080/api
    description: Lokal

tags:
  - name: System
    description: Health check
  - name: Auth
    description: Daftar, masuk, sesi, login Google, onboarding
  - name: Learning
    description: Katalog, dashboard, Case Saya, Sertifikat Saya

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness, proses berjalan
      operationId: getHealth
      responses:
        "200":
          description: Proses berjalan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Liveness"

  /health/ready:
    get:
      tags: [System]
      summary: Readiness, database dan Redis bisa dijangkau
      operationId: getHealthReady
      responses:
        "200":
          description: Semua dependency siap
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Readiness"
        "503":
          description: Ada dependency yang tidak bisa dijangkau (success = false)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Readiness"

  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun mahasiswa, langsung masuk
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Akun dibuat; cookie sesi dipasang
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "409":
          description: Email sudah terdaftar (errors berisi field email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Auth]
      summary: Masuk dengan email dan password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil; cookie sesi dipasang
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          description: Email atau kata sandi salah (pesan sama untuk email yang tidak terdaftar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Akun dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token dan terbitkan access token baru
      description: Dipanggil client otomatis saat request lain mendapat 401. Tanpa body; membaca cookie refresh_token.
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Sesi diperbarui; cookie baru dipasang
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          description: Refresh token tidak ada, kedaluwarsa, atau dicabut; cookie dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Keluar dari perangkat ini
      description: Publik agar cookie tetap terhapus walau sesi sudah kedaluwarsa. Tanpa body.
      operationId: logout
      responses:
        "200":
          description: Sesi dicabut dan cookie dihapus (data null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /auth/me:
    get:
      tags: [Auth]
      summary: User yang sedang masuk
      operationId: getMe
      security:
        - accessCookie: []
      responses:
        "200":
          description: Data user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/google:
    get:
      tags: [Auth]
      summary: Mulai login Google (navigasi browser, bukan XHR)
      operationId: startGoogleLogin
      parameters:
        - name: next
          in: query
          required: false
          description: Path internal tujuan setelah login, mis. /cases/flash-sale. Path tidak aman diabaikan.
          schema:
            type: string
      responses:
        "302":
          description: Redirect ke Google, atau ke /login?error=google bila login Google nonaktif

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback dari Google
      operationId: googleCallback
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: |
            Berhasil → cookie sesi dipasang lalu redirect ke front-end (onboarding untuk akun
            baru, `next`, atau beranda peran). Gagal → /login?error=google atau
            /login?error=account_disabled.

  /users/me/onboarding:
    patch:
      tags: [Auth]
      summary: Lengkapi onboarding mahasiswa
      operationId: completeOnboarding
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Profil tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Bukan mahasiswa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cases:
    get:
      tags: [Learning]
      summary: Katalog case terbit (bisa tanpa login)
      description: |
        Bila login, urutan `relevance` mendahulukan bidang pilihan user, dan `excludeEnrolled=true`
        menyembunyikan case yang sudah diambil.
      operationId: listCases
      parameters:
        - { name: tier, in: query, schema: { type: string, enum: [ai, b2b] } }
        - { name: field, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, popular, rating, price_low], default: relevance } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: excludeEnrolled, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: Satu halaman katalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/CaseSummary"
                          metadata:
                            $ref: "#/components/schemas/PaginationMeta"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cases/{slug}:
    get:
      tags: [Learning]
      summary: Info umum case sebelum mulai atau membayar (tanpa brief lengkap)
      operationId: getCase
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Detail case; `myEnrollment` terisi bila user login dan sudah mengambil case
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/dashboard:
    get:
      tags: [Learning]
      summary: Dashboard mahasiswa
      operationId: getDashboard
      security:
        - accessCookie: []
      responses:
        "200":
          description: Statistik, case yang perlu tindakan, dan rekomendasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me/enrollments:
    get:
      tags: [Learning]
      summary: Case Saya
      operationId: listEnrollments
      security:
        - accessCookie: []
      parameters:
        - { name: tier, in: query, schema: { type: string, enum: [ai, b2b] } }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, not_started, in_progress, ai_grading, in_review, revision_requested, passed, failed]
        - { name: field, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, deadline, title], default: recent } }
      responses:
        "200":
          description: Enrollment milik user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Enrollment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Learning]
      summary: Mulai AI case gratis (idempoten)
      description: B2B case ditolak 409 karena harus lewat checkout.
      operationId: startCase
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId]
              properties:
                caseId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Enrollment baru atau yang sudah ada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Enrollment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Case B2B harus dibayar lewat checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /me/certificates:
    get:
      tags: [Learning]
      summary: Sertifikat Saya
      operationId: listCertificates
      security:
        - accessCookie: []
      parameters:
        - { name: tier, in: query, schema: { type: string, enum: [ai, b2b] } }
      responses:
        "200":
          description: Sertifikat milik user, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  headers:
    SessionCookies:
      description: |
        access_token (HttpOnly, SameSite=Lax, Path=/api, 30 menit) dan
        refresh_token (HttpOnly, SameSite=Lax, Path=/api/auth, 30 hari).
      schema:
        type: string

  schemas:
    CaseSummary:
      type: object
      description: ICaseSummary di client
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        tier: { type: string, enum: [ai, b2b] }
        fieldKey: { type: string }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        durationLabel: { type: string }
        deliverableCount: { type: integer }
        partnerName: { type: string, nullable: true }
        price: { type: integer, nullable: true, description: Rupiah; null untuk AI case }
        participantCount: { type: integer, description: Enrollment selain pending_payment }
        rating: { type: number, description: Rata-rata case_ratings (1 desimal); 0 bila belum ada }

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          properties:
            about: { type: string }
            activities: { type: array, items: { type: string } }
            deliverables:
              type: array
              description: Diambil dari judul dan deskripsi slot submission
              items:
                type: object
                properties:
                  title: { type: string }
                  description: { type: string }
            skills: { type: array, items: { type: string } }
            prerequisites: { type: array, items: { type: string } }
            criteria:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  weight: { type: integer }
            reviewerRole: { type: string, nullable: true }
            partner:
              type: object
              nullable: true
              properties:
                name: { type: string }
                industry: { type: string }
                about: { type: string }
            myEnrollment:
              type: object
              nullable: true
              properties:
                status: { type: string }

    Enrollment:
      type: object
      description: IEnrollment di client
      properties:
        id: { type: string, format: uuid }
        caseSummary:
          $ref: "#/components/schemas/CaseSummary"
        status:
          type: string
          enum: [pending_payment, not_started, in_progress, ai_grading, in_review, revision_requested, passed, failed]
        deadlineAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        score: { type: integer, nullable: true }
        certificateId: { type: string, nullable: true, description: public_id sertifikat yang masih berlaku }

    Certificate:
      type: object
      description: ICertificate di client
      properties:
        id: { type: string, description: public_id untuk URL verifikasi }
        caseTitle: { type: string }
        tier: { type: string, enum: [ai, b2b] }
        fieldKey: { type: string }
        recipientName: { type: string }
        partnerName: { type: string, nullable: true }
        score: { type: integer }
        issuedAt: { type: string, format: date-time }

    Dashboard:
      type: object
      description: IDashboardSummary di client
      properties:
        stats:
          type: object
          properties:
            totalCount: { type: integer }
            statusCounts: { type: object, additionalProperties: { type: integer } }
            activeCount: { type: integer }
            inReviewCount: { type: integer }
            revisionCount: { type: integer }
            certificateCount: { type: integer }
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        recommendations:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CaseSummary"
        hasPassedAiCase: { type: boolean }
        hasPassedB2bCase: { type: boolean }

    User:
      type: object
      description: IUser di client
      required: [id, name, email, role, isOnboarded, fieldKeys, studentStatus, major]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, reviewer, admin]
        isOnboarded:
          type: boolean
        fieldKeys:
          type: array
          items:
            type: string
        studentStatus:
          type: string
          enum: [final_year, fresh_graduate]
          nullable: true
        major:
          type: string
          nullable: true

    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Minimal 8 karakter, mengandung huruf dan angka

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    OnboardingRequest:
      type: object
      required: [fieldKeys, studentStatus]
      properties:
        fieldKeys:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
          description: Key dari taksonomi bidang (backend, data, marketing, ...)
        studentStatus:
          type: string
          enum: [final_year, fresh_graduate]
        major:
          type: string
          maxLength: 100
          nullable: true

    Envelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true

    ErrorEnvelope:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
          description: Pesan untuk user, ditampilkan client sebagai toast
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Nama field JSON di form client, misalnya `email` atau `values.designDoc`
        message:
          type: string

    PaginationMeta:
      type: object
      required: [page, limit, totalItems, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                example: database
              status:
                type: string
                enum: [up, down]

  responses:
    ValidationError:
      description: Error validasi per field (422)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Sesi tidak ada atau kedaluwarsa (401); client memanggil /auth/refresh
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Terlalu banyak percobaan (429)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Data tidak ada atau bukan milik user (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
