  /reviewer/submissions/{id}/grade:
    post:
      tags: [Reviewer]
      summary: Nilai submission
      description: >-
        Level 1-5 dan alasan (minimal 20 karakter) untuk setiap kriteria rubrik, dicocokkan lewat
        nama; feedback 3 bagian masing-masing 1-10 poin. Skor total dihitung server lewat
        hook.OnReviewed; lulus menerbitkan sertifikat berlogo mitra. Rekomendasi hanya berlaku bila
        lulus, dan meminta persetujuan berbagi profil sesuai pengaturan peserta. Field error:
        criteria.N.level, criteria.N.reason, feedback.strengths, feedback.improvements,
        feedback.nextSteps.
      operationId: gradeSubmission
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                criteria:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      level: { type: integer, minimum: 1, maximum: 5 }
                      reason: { type: string }
                feedback:
                  type: object
                  properties:
                    strengths: { type: array, items: { type: string } }
                    improvements: { type: array, items: { type: string } }
                    nextSteps: { type: array, items: { type: string } }
                isRecommended: { type: boolean }
      responses:
        "200":
          description: Submission setelah dinilai
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReviewQueueItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

