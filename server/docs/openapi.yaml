      description: >-
        B2B menunggu review, maksimal sekali per 24 jam. Email menyusul bersama Resend.
      operationId: remindReviewer
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminReviewDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/reviews/{id}/reassign:
    post:
      tags: [Admin]
      summary: Ganti reviewer
      description: >-
        Ke reviewer aktif lain dari mitra yang sama; penugasan case ditambahkan bila belum ada.
        Draft reviewer lama dibuang, tenggat SLA tidak berubah.
      operationId: reassignReviewer
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerId]
              properties:
                reviewerId: { type: string, format: uuid }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminReviewDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/cases:
    get:
      tags: [Admin]
      summary: Daftar case (draft dan terbit)
      description: Maksimal 500, urut terakhir diubah. Jumlah peserta tidak menghitung order yang belum dibayar.
      operationId: listAdminCases
      security:
        - accessCookie: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminCaseSummary" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Admin]
      summary: Buat case
      description: >-
        isPublish false menyimpan draft (cukup judul, bidang, level, ambang lulus, dan berkas materi);
        true memakai validasi penuh lalu menerbitkan case. Slug dibuat dari judul dan tidak berubah.
      operationId: createAdminCase
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCaseSaveRequest" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminCase"
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/cases/{id}:
    get:
      tags: [Admin]
      summary: Isi pembuat case
      operationId: getAdminCase
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminCase"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Admin]
      summary: Perbarui case
      description: >-
        Menimpa isi case beserta tugas, materi, slot, dan rubrik. Case terbit tidak bisa kembali ke
        draft (409). Setelah ada enrollment, tier tidak bisa diubah; setelah ada peserta yang mulai,
        jumlah, jenis, wajib, format, dan ukuran slot serta jumlah dan bobot kriteria dikunci (422,
        field slots/rubric). Mengganti mitra melepas reviewer mitra lama; ditolak 409 bila mereka masih
        memegang submission menunggu.
      operationId: updateAdminCase
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCaseSaveRequest" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminCase"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/uploads:
    post:
      tags: [Admin]
      summary: URL unggah materi pendukung
      description: >-
        Membuat berkas pending (purpose material) dan URL PUT ke R2. Format PDF, DOCX, XLSX, PPTX,
        CSV, ZIP, TXT, MD, PNG, JPG; maksimal 50 MB. Berkas terlampir saat case disimpan; yang tidak
        dipakai dibersihkan bersama unggahan pending lain.
      operationId: createMaterialUpload
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, sizeBytes]
              properties:
                fileName: { type: string }
                sizeBytes: { type: integer, format: int64 }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UploadTicket"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/talent-pool:
    get:
      tags: [Admin]
      summary: Daftar kandidat B2B yang direkomendasikan reviewer
      operationId: listAdminTalentPool
      security:
        - accessCookie: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TalentCandidate" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /admin/talent-pool/{id}/share:
    post:
      tags: [Admin]
      summary: Teruskan profil kandidat ke mitra
      description: >-
        Wajib kandidat sudah menyetujui (consent = granted) dan belum pernah diteruskan.
      operationId: shareTalentCandidate
      security:
        - accessCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TalentCandidate"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/fields:
    get:
      tags: [Admin]
      summary: Daftar bidang studi beserta jumlah case dan member
      operationId: listAdminFields
      security:
        - accessCookie: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminField" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Admin]
      summary: Tambah bidang studi baru
      operationId: createAdminField
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFieldInput" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminField"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/fields/{key}:
    put:
      tags: [Admin]
      summary: Perbarui nama dan keterangan bidang studi
      operationId: updateAdminField
      security:
        - accessCookie: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFieldInput" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminField" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/fields/{key}/status:
    put:
      tags: [Admin]
      summary: Aktifkan atau nonaktifkan bidang studi
      operationId: setAdminFieldStatus
      security:
        - accessCookie: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminField" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/fields/{key}/move:
    post:
      tags: [Admin]
      summary: Tukar urutan bidang studi ke atas (-1) atau ke bawah (1)
      operationId: moveAdminField
      security:
        - accessCookie: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: integer, enum: [-1, 1] }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminField" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/settings:
    get:
      tags: [Admin]
      summary: Pengaturan platform beserta nilai bawaan dan riwayat perubahan
      operationId: getAdminSettings
      security:
        - accessCookie: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Admin]
      summary: Simpan pengaturan platform dan catat perubahan
      operationId: saveAdminSettings
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSettings" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminSettings"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  headers:
    SessionCookies:
      description: |
        access_token (HttpOnly, SameSite=Lax, Path=/api, 30 menit) dan
        refresh_token (HttpOnly, SameSite=Lax, Path=/api/auth, 30 hari).
      schema:
        type: string

  schemas:
    CaseSummary:
      type: object
      description: ICaseSummary di client
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        tier: { type: string, enum: [ai, b2b] }
        fieldKey: { type: string }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        durationLabel: { type: string }
        deliverableCount: { type: integer }
        partnerName: { type: string, nullable: true }
        price: { type: integer, nullable: true, description: Rupiah; null untuk AI case }
        participantCount: { type: integer, description: Enrollment selain pending_payment }
        rating: { type: number, description: Rata-rata case_ratings (1 desimal); 0 bila belum ada }

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          properties:
            about: { type: string }
            activities: { type: array, items: { type: string } }
            deliverables:
              type: array
              description: Diambil dari judul dan deskripsi slot submission
              items:
                type: object
                properties:
                  title: { type: string }
                  description: { type: string }
            skills: { type: array, items: { type: string } }
            prerequisites: { type: array, items: { type: string } }
            criteria:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  weight: { type: integer }
            reviewerRole: { type: string, nullable: true }
            partner:
              type: object
              nullable: true
              properties:
                name: { type: string }
                industry: { type: string }
                about: { type: string }
            myEnrollment:
              type: object
              nullable: true
              properties:
                status: { type: string }

    Enrollment:
      type: object
      description: IEnrollment di client
      properties:
        id: { type: string, format: uuid }
        caseSummary:
          $ref: "#/components/schemas/CaseSummary"
        status:
          type: string
          enum: [pending_payment, not_started, in_progress, ai_grading, in_review, revision_requested, passed, failed]
        deadlineAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        score: { type: integer, nullable: true }
        certificateId: { type: string, nullable: true, description: public_id sertifikat yang masih berlaku }

    Certificate:
      type: object
      description: ICertificate di client
      properties:
        id: { type: string, description: public_id untuk URL verifikasi }
        caseTitle: { type: string }
        tier: { type: string, enum: [ai, b2b] }
        fieldKey: { type: string }
        recipientName: { type: string }
        partnerName: { type: string, nullable: true }
        score: { type: integer }
        issuedAt: { type: string, format: date-time }

    Dashboard:
      type: object
      description: IDashboardSummary di client
      properties:
        stats:
          type: object
          properties:
            totalCount: { type: integer }
            statusCounts: { type: object, additionalProperties: { type: integer } }
            activeCount: { type: integer }
            inReviewCount: { type: integer }
            revisionCount: { type: integer }
            certificateCount: { type: integer }
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        recommendations:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CaseSummary"
        hasPassedAiCase: { type: boolean }
        hasPassedB2bCase: { type: boolean }

    User:
      type: object
      description: IUser di client
      required: [id, name, email, role, isOnboarded, fieldKeys, studentStatus, major]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, reviewer, admin]
        isOnboarded:
          type: boolean
        fieldKeys:
          type: array
          items:
            type: string
        studentStatus:
          type: string
          enum: [final_year, fresh_graduate]
          nullable: true
        major:
          type: string
          nullable: true

    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Minimal 8 karakter, mengandung huruf dan angka

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    OnboardingRequest:
      type: object
      required: [fieldKeys, studentStatus]
      properties:
        fieldKeys:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
          description: Key dari taksonomi bidang (backend, data, marketing, ...)
        studentStatus:
          type: string
          enum: [final_year, fresh_graduate]
        major:
          type: string
          maxLength: 100
          nullable: true

    Envelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true

    ErrorEnvelope:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
          description: Pesan untuk user, ditampilkan client sebagai toast
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Nama field JSON di form client, misalnya `email` atau `values.designDoc`
        message:
          type: string

    PaginationMeta:
      type: object
      required: [page, limit, totalItems, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                example: database
              status:
                type: string
                enum: [up, down]

    SlotValue:
      description: Isian slot (TSlotValue)
      nullable: true
      oneOf:
        - type: string
        - $ref: "#/components/schemas/FileMeta"
    FileMeta:
      type: object
      required: [fileId, fileName, sizeBytes]
      properties:
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        sizeBytes: { type: integer }
    SubmissionContent:
      type: object
      required: [values, note, isLinkPublic, isOwnWork]
      properties:
        values:
          type: object
          description: Isian per slotId
          additionalProperties:
            $ref: "#/components/schemas/SlotValue"
        note: { type: string, maxLength: 1000 }
        isLinkPublic: { type: boolean }
        isOwnWork: { type: boolean }
    SubmissionDraft:
      allOf:
        - $ref: "#/components/schemas/SubmissionContent"
        - type: object
          required: [savedAt]
          properties:
            savedAt: { type: string, format: date-time }
    SubmissionRecord:
      allOf:
        - $ref: "#/components/schemas/SubmissionContent"
        - type: object
          required: [submittedAt, attempt]
          properties:
            submittedAt: { type: string, format: date-time }
            attempt: { type: integer, minimum: 1 }
    SubmissionSlot:
      type: object
      properties:
        id: { type: string, description: slot_key }
        title: { type: string }
        description: { type: string }
        kind: { type: string, enum: [file, link, text] }
        isRequired: { type: boolean }
        formats: { type: array, items: { type: string } }
        maxSizeMb: { type: integer, nullable: true }
        linkHint: { type: string }
        minLength: { type: integer, nullable: true, description: Slot teks; panjang minimal saat submit }
        maxLength: { type: integer, nullable: true, description: Slot teks; null = batas bawaan 20000 }
    RubricCriterion:
      type: object
      properties:
        name: { type: string }
        weight: { type: integer }
        description: { type: string }
    CaseBrief:
      type: object
      properties:
        context: { type: array, items: { type: string } }
        tasks:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
        materials:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              format: { type: string, example: PDF }
              sizeLabel: { type: string, example: "1,8 MB" }
              description: { type: string }
              downloadUrl:
                type: string
                nullable: true
                description: URL unduhan R2 sementara; hanya di workspace peserta
        rubric: { type: array, items: { $ref: "#/components/schemas/RubricCriterion" } }
        slots: { type: array, items: { $ref: "#/components/schemas/SubmissionSlot" } }
        passingScore: { type: integer }
        deadlineDays: { type: integer, nullable: true }
    Workspace:
      type: object
      properties:
        caseInfo: { $ref: "#/components/schemas/CaseDetail" }
        brief:
          allOf: [{ $ref: "#/components/schemas/CaseBrief" }]
          nullable: true
        enrollment:
          allOf: [{ $ref: "#/components/schemas/Enrollment" }]
          nullable: true
        draft:
          allOf: [{ $ref: "#/components/schemas/SubmissionDraft" }]
          nullable: true
        submission:
          allOf: [{ $ref: "#/components/schemas/SubmissionRecord" }]
          nullable: true
        revision:
          type: object
          nullable: true
          properties:
            reason: { type: string }
            note: { type: string }
            reviewerRole: { type: string }
            requestedAt: { type: string, format: date-time }
    CaseStatus:
      type: object
      properties:
        caseInfo: { $ref: "#/components/schemas/CaseDetail" }
        enrollment:
          allOf: [{ $ref: "#/components/schemas/Enrollment" }]
          nullable: true
        submission:
          allOf: [{ $ref: "#/components/schemas/SubmissionRecord" }]
          nullable: true
        slots: { type: array, items: { $ref: "#/components/schemas/SubmissionSlot" } }
        rubric: { type: array, items: { $ref: "#/components/schemas/RubricCriterion" } }
        passingScore: { type: integer }
        reviewDueAt: { type: string, format: date-time, nullable: true }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [paid, started, submitted, revision_requested, reviewed, retried] }
              at: { type: string, format: date-time }
              attempt: { type: integer, nullable: true }
        aiGrading:
          type: object
          nullable: true
          properties:
