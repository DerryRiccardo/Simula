      type: object
      description: IAdminField di client
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        order: { type: integer }
        caseCount: { type: integer }
        memberCount: { type: integer }
    PlatformSettings:
      type: object
      description: IPlatformSettings di client
      required:
        - reviewSlaDays
        - maxRevisions
        - revisionExtraDays
        - recommendationThreshold
        - passingScoreAi
        - passingScoreB2b
        - b2bStartWindowDays
        - paymentWindowHours
        - whatsappNumber
      properties:
        reviewSlaDays: { type: integer, minimum: 1, maximum: 15 }
        maxRevisions: { type: integer, minimum: 0, maximum: 5 }
        revisionExtraDays: { type: integer, minimum: 1, maximum: 14 }
        recommendationThreshold: { type: integer, minimum: 50, maximum: 100 }
        passingScoreAi: { type: integer, minimum: 1, maximum: 100 }
        passingScoreB2b: { type: integer, minimum: 1, maximum: 100 }
        b2bStartWindowDays: { type: integer, minimum: 7, maximum: 180 }
        paymentWindowHours: { type: integer, minimum: 1, maximum: 72 }
        whatsappNumber: { type: string }
    AdminSettings:
      type: object
      description: IAdminSettings di client
      properties:
        values: { $ref: "#/components/schemas/PlatformSettings" }
        defaults: { $ref: "#/components/schemas/PlatformSettings" }
        log:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              at: { type: string, format: date-time }
              actorName: { type: string }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    label: { type: string }
                    from: { type: string }
                    to: { type: string }
  responses:
    Conflict:
      description: Status tidak mengizinkan aksi ini (mis. sudah terkirim atau tenggat lewat)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Error validasi per field (422)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Sesi tidak ada atau kedaluwarsa (401); client memanggil /auth/refresh
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Terlalu banyak percobaan (429)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Data tidak ada atau bukan milik user (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
